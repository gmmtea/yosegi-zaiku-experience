<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@700&display=swap');
:root{--paper:#f5ede0;--wl:#e8d5b7;--wm:#c9a96e;--wd:#8b5e3c;--wdp:#4a2c1a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--wdp);font-family:'Noto Serif JP',serif;min-height:100vh;user-select:none;}

header{text-align:center;padding:14px 20px 10px;border-bottom:2px solid var(--wm);}
header>*{max-width:600px;margin-left:auto;margin-right:auto;}
h1{font-family:'Shippori Mincho',serif;font-size:clamp(28px,7vw,52px);letter-spacing:.15em;line-height:1.1;}
.nav-inner{max-width:600px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;}

.wrap{max-width:600px;margin:0 auto;padding:12px 10px 28px;}

/* Palette + eraser layout */
.palette-area{display:flex;gap:6px;align-items:stretch;margin-bottom:12px;}
.palette-rows{display:flex;flex-direction:column;gap:6px;flex:1;}
.palette-grid{display:flex;gap:6px;}

.p-cell{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:8px 2px;
  border:2px solid var(--wm);background:white;border-radius:5px;
  cursor:pointer;transition:border-color .1s,background .1s;
}
.p-cell:hover{border-color:var(--wd);background:#fdf6ec;}
.p-cell.selected{border-color:var(--wd);background:var(--wl);box-shadow:0 0 0 2px var(--wd);}
.p-cell svg{width:100%;height:auto;display:block;pointer-events:none;max-width:70px;}

/* Eraser button: spans both rows */
.eraser-btn{
  width:60px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px solid var(--wm);background:white;border-radius:5px;
  cursor:pointer;transition:border-color .1s,background .1s;
  font-size:28px;
  padding:6px 0;
}
.eraser-btn:hover{border-color:var(--wd);background:#fdf6ec;}
.eraser-btn.selected{border-color:var(--wd);background:var(--wl);box-shadow:0 0 0 2px var(--wd);}
.eraser-lbl{font-size:clamp(13px,3vw,19px);color:var(--wd);font-family:'Noto Serif JP',serif;}

/* ── CANVAS WRAPPER: full width, relative for overlaid buttons ── */
.canvas-wrap{
  position:relative;
  width:100%;
  margin-bottom:10px;
}
.cbox{
  background:#fff8f0;
  position:relative;
  border:1px solid var(--wm);
  box-shadow:3px 3px 0 var(--wm),6px 6px 0 rgba(139,94,60,.15);
  border-radius:2px;overflow:hidden;
  width:100%;
}
canvas{display:block;touch-action:none;width:100% !important;height:auto !important;}

/* Rotation buttons overlaid on bottom corners of canvas */
.rot-btn{
  position:absolute;bottom:10px;
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.rot-btn:hover{border-color:var(--wd);background:var(--wl);}
#rotL{left:10px;}
#rotR{right:10px;}

/* Zoom buttons: just above rotation buttons */
.zoom-btn{
  position:absolute;bottom:clamp(56px,11vw,72px);
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.zoom-btn:hover{border-color:var(--wd);background:var(--wl);}
.zoom-btn:disabled{opacity:0.3;pointer-events:none;background:white;border-color:var(--wm);}

/* Move buttons at canvas edges */
.move-btn{
  position:absolute;
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.move-btn:hover{border-color:var(--wd);background:var(--wl);}

/* ── STATS + BOTTOM ── */
.stats-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:10px;}
.pb-wrap{width:240px;height:7px;background:var(--wl);border-radius:4px;overflow:hidden;}
.pf{height:100%;background:var(--wd);border-radius:4px;transition:width .3s;}
.piece-count{font-size:16px;color:var(--wd);white-space:nowrap;}
.bottom-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.btn{
  flex:1;
  padding:14px 10px;border:none;cursor:pointer;
  font-family:'Noto Serif JP',serif;font-size:clamp(15px,3.5vw,22px);
  border-radius:4px;transition:all .15s;
}
.btn-p{background:var(--wd);color:var(--paper);}
.btn-p:hover{background:var(--wdp);}
.btn-s{background:transparent;color:var(--wd);border:1.5px solid var(--wm);cursor:pointer;}
.btn-s:hover{border-color:var(--wd);background:var(--wl);}
.btn-s:disabled{opacity:0.3;pointer-events:none;}

/* Modal */
.ov{display:none;position:fixed;inset:0;background:rgba(74,44,26,.85);z-index:200;align-items:center;justify-content:center;}
#toast{position:absolute;top:20px;left:50%;transform:translateX(-50%);background:rgba(74,44,26,0.92);color:#f5ede0;font-family:'Noto Serif JP',serif;font-size:15px;padding:10px 20px;border-radius:24px;white-space:nowrap;pointer-events:none;z-index:400;opacity:0;transition:opacity 0.3s;}
#toastCopy{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:rgba(74,44,26,0.92);color:#f5ede0;font-family:'Noto Serif JP',serif;font-size:15px;padding:10px 20px;border-radius:24px;white-space:nowrap;pointer-events:none;z-index:500;opacity:0;transition:opacity 0.3s;}
.ov.show{display:flex;}
.mc{background:var(--paper);padding:28px;text-align:center;max-width:440px;width:90%;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.mct{font-family:'Shippori Mincho',serif;font-size:30px;margin-bottom:6px;}
.mcs{font-size:16px;color:var(--wd);margin-bottom:14px;line-height:1.8;}
</style>

var globalRotSteps = 1; // 30° default: vertical lines
var pieces  = [];
var triMap  = {};
var nextId  = 1;
var history = []; // [{action:'add'|'remove', piece}]
var selShape= null, selColor=null, selCell=null, hoverDir='rh0';
var eraserMode=false;
var warnCells={}, WARN_MS=600;
var fadingPieces=[];
var FADE_MS=100;
var FADE_IN_MS=200;

// ── Grid ──────────────────────────────────────────────────────
var T    = 104;
var H    = T*Math.sqrt(3)/2;
var PAD  = 4;
var CW   = 900;
var CH   = 900;
// COLS/ROWS: enough to cover canvas diagonal when rotated (diagonal = CW*√2 ≈ 1273)
var COLS = Math.ceil(1800/(T/2))+4;
var ROWS = Math.ceil(1800/H)+4;

function snapToCenter(){
  gridOffX = CW/2 - Math.round((CW/2)/(T/2)) * (T/2);
  gridOffY = CH/2 - Math.round((CH/2)/H) * H;
}
var gridOffX=0, gridOffY=0;
snapToCenter();

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
canvas.width=CW; canvas.height=CH;
// CSS handles display size via width:100%

// ── Geometry ──────────────────────────────────────────────────
function isUp(c,r){return(c+r)%2===0;}
function getVerts(c,r){
  // x0, y0: top-left corner of this triangle's bounding cell
  // Up-tri:   apex=(x0+T/2, y0), BL=(x0, y0+H), BR=(x0+T, y0+H)
  // Down-tri: TL=(x0, y0), TR=(x0+T, y0), apex=(x0+T/2, y0+H)
  // Vertices land on: x = gridOffX + n*(T/2), y = gridOffY + m*H
  // x0 = gridOffX + c*(T/2) - T/2  so apex of up-tri = gridOffX + c*(T/2)
  var x0 = gridOffX + c*(T/2) - T/2;
  var y0 = gridOffY + r*H;
  if(isUp(c,r)) return [{x:x0+T/2,y:y0},{x:x0+T,y:y0+H},{x:x0,y:y0+H}];
  return [{x:x0,y:y0},{x:x0+T,y:y0},{x:x0+T/2,y:y0+H}];
}
function getCenter(c,r){
  var v=getVerts(c,r);
  return{x:(v[0].x+v[1].x+v[2].x)/3,y:(v[0].y+v[1].y+v[2].y)/3};
}
function cellInGrid(c,r){ return true; }
function sign3(ax,ay,bx,by,cx,cy){return(ax-cx)*(by-cy)-(bx-cx)*(ay-cy);}
function ptInTri(px,py,v){
  var d1=sign3(px,py,v[0].x,v[0].y,v[1].x,v[1].y);
  var d2=sign3(px,py,v[1].x,v[1].y,v[2].x,v[2].y);
  var d3=sign3(px,py,v[2].x,v[2].y,v[0].x,v[0].y);
  return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
function hitTest(px,py){
  var ac=Math.floor((px-gridOffX)/(T/2)), ar=Math.floor((py-gridOffY)/H);
  for(var dr=-1;dr<=1;dr++) for(var dc=-2;dc<=2;dc++){
    var c=ac+dc,r=ar+dr;
    if(!cellInGrid(c,r)) continue;
    if(ptInTri(px,py,getVerts(c,r))) return{col:c,row:r};
  }
  return null;
}

// ── Rhombus ────────────────────────────────────────────────────
function getRhPair(c,r,dir){
  var up=isUp(c,r),p;
  if(dir==='rh0') p=up?{col:c+1,row:r}:{col:c-1,row:r};
  else if(dir==='rh1') p=up?{col:c,row:r+1}:{col:c,row:r-1};
  else p=up?{col:c-1,row:r}:{col:c+1,row:r};
  return[{col:c,row:r},p];
}
function bestRhDir(c,r,px,py){
  var v=getVerts(c,r),up=isUp(c,r);
  var mids=[
    {mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2},
    {mx:(v[1].x+v[2].x)/2,my:(v[1].y+v[2].y)/2},
    {mx:(v[2].x+v[0].x)/2,my:(v[2].y+v[0].y)/2},
  ];
  var best=0,bd=Infinity;
  for(var i=0;i<3;i++){var dx=mids[i].mx-px,dy=mids[i].my-py,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
  if(up) return['rh0','rh1','rh2'][best];
  return['rh1','rh2','rh0'][best];
}

// ── Canvas coord (undo rotation) ──────────────────────────────
function canvasPos(e){
  var rect=canvas.getBoundingClientRect();
  var sx=CW/rect.width,sy=CH/rect.height;
  var ex=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-rect.left;
  var ey=(e.clientY!==undefined?e.clientY:e.touches[0].clientY)-rect.top;
  var cx=ex*sx,cy=ey*sy;
  var a=globalRotSteps*Math.PI/6;
  var dx=cx-CW/2,dy=cy-CH/2;
  var co=Math.cos(-a),si=Math.sin(-a);
  return{x:co*dx-si*dy+CW/2,y:si*dx+co*dy+CH/2};
}

// ── Drawing ────────────────────────────────────────────────────
function luma(hex){
  return.299*parseInt(hex.slice(1,3),16)+.587*parseInt(hex.slice(3,5),16)+.114*parseInt(hex.slice(5,7),16);
}
function fillTri(c2d,v,color){
  c2d.beginPath();
  c2d.moveTo(v[0].x,v[0].y);c2d.lineTo(v[1].x,v[1].y);c2d.lineTo(v[2].x,v[2].y);
  c2d.closePath();c2d.fillStyle=color;c2d.fill();
  c2d.save();c2d.clip();
  c2d.strokeStyle=luma(color)>100?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.04)';
  c2d.lineWidth=0.7;
  for(var i=-80;i<80;i+=5){c2d.beginPath();c2d.moveTo(-80+i,-80);c2d.lineTo(80+i,80);c2d.stroke();}
  c2d.restore();
}
function drawPieceBorder(c2d,cells){
  var eps=0.5;
  function ek(a,b){
    var ka=Math.round(a.x/eps)+','+Math.round(a.y/eps);
    var kb=Math.round(b.x/eps)+','+Math.round(b.y/eps);
    return ka<kb?ka+'|'+kb:kb+'|'+ka;
  }
  var cnt={},dat={};
  cells.forEach(function(cc){
    var v=getVerts(cc.col,cc.row);
    [[v[0],v[1]],[v[1],v[2]],[v[2],v[0]]].forEach(function(e){
      var k=ek(e[0],e[1]);cnt[k]=(cnt[k]||0)+1;dat[k]=e;
    });
  });
  c2d.strokeStyle='rgba(255,255,255,0.6)';c2d.lineWidth=1.0;c2d.lineCap='round';
  for(var k in cnt){
    if(cnt[k]===1){var e=dat[k];c2d.beginPath();c2d.moveTo(e[0].x,e[0].y);c2d.lineTo(e[1].x,e[1].y);c2d.stroke();}
  }
}
function getPreviewCells(cell,shape,dir){
  if(!cell) return[];
  if(shape==='tri') return[{col:cell.col,row:cell.row}];
  return getRhPair(cell.col,cell.row,dir).filter(function(cc){return cc&&cellInGrid(cc.col,cc.row);});
}

// ── Render ─────────────────────────────────────────────────────
function render(){ renderWithAnim(); }

function animateWarns(){

}

// Click / tap to place or erase
var toastTimer=null;
function showToast(){
  var el=document.getElementById('toast');
  el.textContent=TEXTS[lang].toast;
  el.style.opacity='1';
  if(toastTimer) clearTimeout(toastTimer);

}

canvas.addEventListener('click',function(e){
  var p=canvasPos(e),cell=hitTest(p.x,p.y);if(!cell) return;

  }

// Right-click to remove
canvas.addEventListener('contextmenu',function(e){
  e.preventDefault();
  var p=canvasPos(e),cell=hitTest(p.x,p.y);if(!cell) return;
  removePieceAt(cell.col,cell.row);
});

function removePieceAt(col,row){
  var key=col+','+row;
  for(var i=pieces.length-1;i>=0;i--){
    if(pieces[i].keys.indexOf(key)>=0){
      var piece=pieces[i];
      piece.keys.forEach(function(k){delete triMap[k];});
      pieces.splice(i,1);
      history.push({action:'remove',piece:piece});
      fadingPieces.push({keys:piece.keys,color:piece.color,removedAt:Date.now()});
      updateStats();
      requestAnimationFrame(fadeLoop);
      return;
    }
  }
}

function fadeLoop(){
  var now=Date.now();
  fadingPieces=fadingPieces.filter(function(fp){
    var ms = fp.fadeIn ? FADE_IN_MS : FADE_MS;
    var done = now-fp.removedAt >= ms;
    if(done && fp.fadeIn && fp.piece){
      pieces.push(fp.piece);
      history.push({action:'add', piece:fp.piece});
      updateStats();
    }
    return !done;
  });
  renderWithAnim();
  if(fadingPieces.length) requestAnimationFrame(fadeLoop);
}

function doPlace(col,row){
  var cells=selShape==='tri'
    ?[{col:col,row:row}]
    :getRhPair(col,row,hoverDir).filter(function(cc){return cc&&cellInGrid(cc.col,cc.row);});
  if(!cells.length) return;
  var blocked=false;
  cells.forEach(function(cc){
    if(triMap[cc.col+','+cc.row]){blocked=true;warnCells[cc.col+','+cc.row]=Date.now();}
  });
  if(blocked){requestAnimationFrame(animateWarns);return;}
  var keys=cells.map(function(cc){return cc.col+','+cc.row;});
  var piece={id:nextId++,type:selShape,keys:keys,color:selColor};
  pieces.push(piece);
  keys.forEach(function(k){triMap[k]=selColor;});
  history.push({action:'add',piece:piece});
  updateStats();
}

function updateStats(){
  var n=pieces.length;
  document.getElementById('cnt').textContent=n;
  document.getElementById('pf').style.width=Math.min(n/40*100,100)+'%';
  document.getElementById('btnUndo').disabled=history.length===0;
}

// ── Animation ──────────────────────────────────────────────────
// Current animated values
var animRotAngle = globalRotSteps * Math.PI / 6; // actual drawn angle
var animGridOffX = gridOffX;
var animGridOffY = gridOffY;
var animT        = T;
var animH        = H;
var animating    = false;
var LERP         = 0.18;
var currentLerp  = LERP;

var clearResetAnim = null;
function startClearReset(fromRot, fromX, fromY, fromTv, duration){
  if(clearResetAnim) clearResetAnim.active=false;
  var startTime = Date.now();
  var toRot = globalRotSteps * Math.PI / 6;
  var toX = gridOffX, toY = gridOffY, toTv = T;
  clearResetAnim = {active:true};
  var anim = clearResetAnim;
  function easeInOut(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }
  animating = true;
  (function loop(){
    if(!anim.active){ animating=false; return; }
    var t = Math.min((Date.now()-startTime)/duration, 1);
    var e = easeInOut(t);
    animRotAngle  = fromRot + (toRot - fromRot) * e;
    animGridOffX  = fromX   + (toX   - fromX)   * e;
    animGridOffY  = fromY   + (toY   - fromY)   * e;
    animT         = fromTv  + (toTv  - fromTv)  * e;
    animH         = animT * Math.sqrt(3) / 2;
    renderWithAnim();
    if(t < 1) requestAnimationFrame(loop);
    else {
      animRotAngle=toRot; animGridOffX=toX; animGridOffY=toY;
      animT=toTv; animH=H;
      anim.active=false;
      animating=false;
      renderWithAnim();
    }
  })();
}

function lerp(a, b, t){ return a + (b - a) * t; }

function animLoop(){
  var targetAngle = globalRotSteps * Math.PI / 6;
  // Shortest path for rotation
  var da = targetAngle - animRotAngle;
  while(da >  Math.PI) da -= Math.PI*2;
  while(da < -Math.PI) da += Math.PI*2;
  animRotAngle += da * currentLerp;

  animGridOffX = lerp(animGridOffX, gridOffX, currentLerp);
  animGridOffY = lerp(animGridOffY, gridOffY, currentLerp);
  animT        = lerp(animT, T, currentLerp);
  animH        = animT * Math.sqrt(3) / 2;

  var done = Math.abs(da) < 0.001
          && Math.abs(animGridOffX - gridOffX) < 0.2
          && Math.abs(animGridOffY - gridOffY) < 0.2
          && Math.abs(animT - T) < 0.2;

  renderWithAnim();

  if(!done) requestAnimationFrame(animLoop);
  else {
    animRotAngle = targetAngle;
    animGridOffX = gridOffX;
    animGridOffY = gridOffY;
    animT = T; animH = H;
    animating = false;
    renderWithAnim();
  }
}

function startAnim(){
  if(clearResetAnim) clearResetAnim.active=false;
  if(!animating){ animating=true; requestAnimationFrame(animLoop); }
}

// renderWithAnim uses animated values instead of live values
function renderWithAnim(){
  var savedRotSteps = globalRotSteps;
  var savedOffX = gridOffX, savedOffY = gridOffY;
  var savedT = T, savedH = H;

  // Temporarily override with animated values
  var _angle = animRotAngle;
  gridOffX = animGridOffX; gridOffY = animGridOffY;
  T = animT; H = animH;
  COLS = Math.ceil(1800/(T/2))+4;
  ROWS = Math.ceil(1800/H)+4;

  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  ctx.translate(CW/2,CH/2); ctx.rotate(_angle); ctx.translate(-CW/2,-CH/2);

  ctx.fillStyle='#e8ebe6'; ctx.fillRect(-CW,-CH,CW*3,CH*3);

  var margin = Math.ceil(CW*1.5/(T/2));
  var cStart = Math.floor(-gridOffX/(T/2))-margin;
  var cEnd   = Math.ceil((CW-gridOffX)/(T/2))+margin;
  var rStart = Math.floor(-gridOffY/H)-margin;
  var rEnd   = Math.ceil((CH-gridOffY)/H)+margin;
  for(var r=rStart;r<rEnd;r++) for(var c=cStart;c<cEnd;c++){
    var v=getVerts(c,r);
    ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);ctx.lineTo(v[1].x,v[1].y);ctx.lineTo(v[2].x,v[2].y);ctx.closePath();
    ctx.strokeStyle='rgba(100,120,100,0.25)';ctx.lineWidth=1.0;ctx.stroke();
  }

  pieces.forEach(function(piece){
    piece.keys.forEach(function(key){
      var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),piece.color);
    });
  });
  pieces.forEach(function(piece){
    var cells=piece.keys.map(function(k){var p=k.split(',');return{col:+p[0],row:+p[1]};});
    drawPieceBorder(ctx,cells);
  });

  // fading pieces (deleted, fading out)
  var now2=Date.now();
  fadingPieces.forEach(function(fp){
    var elapsed=now2-fp.removedAt;

    if(!fp.clearAnim){
      // Normal fade in/out
      var ms = fp.fadeIn ? FADE_IN_MS : FADE_MS;
      var t=Math.min(elapsed/ms, 1);
      var alpha=fp.fadeIn ? t*0.9 : (1-t)*0.9;
      if(alpha<=0) return;
      ctx.save();
      ctx.globalAlpha=alpha;
      if(fp.scaleIn){
        // scale from 1.4 down to 1.0, ease-out
        var scale = 1.4 - 0.4*t;
        // find center of piece
        var allV=fp.keys.reduce(function(acc,k){
          var p=k.split(','); return acc.concat(getVerts(+p[0],+p[1]));
        },[]);
        var cx=allV.reduce(function(s,v){return s+v.x;},0)/allV.length;
        var cy=allV.reduce(function(s,v){return s+v.y;},0)/allV.length;
        ctx.translate(cx,cy); ctx.scale(scale,scale); ctx.translate(-cx,-cy);
      }
      fp.keys.forEach(function(key){
        var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),fp.color);
      });
      var cells=fp.keys.map(function(k){var p=k.split(',');return{col:+p[0],row:+p[1]};});
      drawPieceBorder(ctx,cells);
      ctx.restore();
      return;
    }

    // Scatter animation
    var t=Math.min(elapsed/fp.animMs,1);
    var alpha=t>0.8 ? 1-(t-0.8)/0.2 : 1;
    if(alpha<=0) return;

    var tx=fp.vx*elapsed*0.5 + fp.vx*elapsed*elapsed*0.003;
    var ty=fp.vy*elapsed*0.5 + fp.vy*elapsed*elapsed*0.003;
    var rot=fp.spin*elapsed*0.05 + fp.spin*elapsed*elapsed*0.0003;

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(fp.cx+tx, fp.cy+ty);
    ctx.rotate(rot);
    ctx.translate(-fp.cx, -fp.cy);
    fp.keys.forEach(function(key){
      var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),fp.color);
    });
    ctx.restore();
  });

  var now=Date.now();
  for(var key in warnCells){
    if(now-warnCells[key]<WARN_MS){
      var p=key.split(','),v=getVerts(+p[0],+p[1]);
      var al=0.5*(1-(now-warnCells[key])/WARN_MS);
      ctx.save();ctx.globalAlpha=al;
      ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);ctx.lineTo(v[1].x,v[1].y);ctx.lineTo(v[2].x,v[2].y);ctx.closePath();
      ctx.fillStyle='#ff3333';ctx.fill();ctx.restore();
    } else { delete warnCells[key]; }
  }

  if(selShape&&selCell){
    var pcells=getPreviewCells(selCell,selShape,hoverDir);
    ctx.globalAlpha=0.45;
    pcells.forEach(function(cc){fillTri(ctx,getVerts(cc.col,cc.row),selColor);});
    ctx.globalAlpha=1;
    drawPieceBorder(ctx,pcells);
  }

  ctx.restore();

  // Restore live values
  gridOffX=savedOffX; gridOffY=savedOffY; T=savedT; H=savedH;
  COLS=Math.ceil(1800/(T/2))+4; ROWS=Math.ceil(1800/H)+4;
}
document.getElementById('rotL').addEventListener('click',function(){globalRotSteps=(globalRotSteps-1+12)%12;startAnim();});
document.getElementById('rotR').addEventListener('click',function(){globalRotSteps=(globalRotSteps+1)%12;startAnim();});

// Zoom: 5 steps, 88 is center (index 2)
var T_STEPS=[56,80,104,128,152];
var tIdx=2; // default T=104

function applyZoom(newT){
  var fx = (CW/2 - gridOffX) / (T/2);
  var fy = (CH/2 - gridOffY) / H;
  T = newT;
  H = T*Math.sqrt(3)/2;
  COLS = Math.ceil(1800/(T/2))+4;
  ROWS = Math.ceil(1800/H)+4;
  gridOffX = CW/2 - fx * (T/2);
  gridOffY = CH/2 - fy * H;
  startAnim();
}

// Move: step size depends on direction relative to grid orientation
// Grid has period T in x (=T/2 per col) and H in y.
// We want: T-direction moves by T, H-direction moves by H.
// Then snap center to nearest vertex or edge midpoint.
function snapGridCenter(){
  // Candidate snap points in x: multiples of T/2 (vertices and edge midpoints)
  // Candidate snap points in y: multiples of H/2 (vertices at 0,H,2H... and edge midpoints at H/2,3H/2...)
  // Actually: grid vertices at x=gridOffX+n*(T/2), y=gridOffY+m*H
  // Edge midpoints (horizontal edges) at same x, y=gridOffY+m*H+H/2
  // So y candidates: gridOffY + k*(H/2) for integer k
  // x candidates: gridOffX + n*(T/2)
  // Snap CW/2 to nearest x candidate, CH/2 to nearest y candidate
  gridOffX = CW/2 - Math.round((CW/2 - gridOffX)/(T/2)) * (T/2);
  gridOffY = CH/2 - Math.round((CH/2 - gridOffY)/(H/2)) * (H/2);
}

function moveGrid(dx_screen, dy_screen){
  var a = globalRotSteps * Math.PI / 6;
  // Vertical buttons (up/down, dy_screen!=0): odd rot=T, even rot=H
  // Horizontal buttons (left/right, dx_screen!=0): odd rot=H, even rot=T
  var isVertical = dy_screen !== 0;
  var S;
  if(isVertical){
    S = (globalRotSteps % 2 === 1) ? T/2 : H/2;
  } else {
    S = (globalRotSteps % 2 === 1) ? H/2 : T/2;
  }
  var dcx = (Math.cos(-a)*dx_screen - Math.sin(-a)*dy_screen) * S;
  var dcy = (Math.sin(-a)*dx_screen + Math.cos(-a)*dy_screen) * S;
  gridOffX += dcx;
  gridOffY += dcy;
  startAnim();
}
document.getElementById('moveUp').addEventListener('click',    function(){ moveGrid( 0,  1); });
document.getElementById('moveDown').addEventListener('click',  function(){ moveGrid( 0, -1); });
document.getElementById('moveLeft').addEventListener('click',  function(){ moveGrid( 1,  0); });

document.getElementById('btnUndo').addEventListener('click',function(){
  if(!history.length) return;
  var entry=history.pop();
  if(entry.action==='add'){
    // undo add: remove the piece
    var idx=pieces.indexOf(entry.piece);
    if(idx>=0) pieces.splice(idx,1);
    entry.piece.keys.forEach(function(k){delete triMap[k];});
    fadingPieces.push({keys:entry.piece.keys,color:entry.piece.color,removedAt:Date.now()});
    updateStats();requestAnimationFrame(fadeLoop);
  } else {
    // undo remove: fade in, then add to pieces after animation
    fadingPieces.push({keys:entry.piece.keys,color:entry.piece.color,removedAt:Date.now(),fadeIn:true,piece:entry.piece});
    updateStats();requestAnimationFrame(fadeLoop);
  }
});

document.getElementById('btnConfirmYes').addEventListener('click',function(){
  var now=Date.now();
  var ANIM_MS=2000;

  // グリッド→スクリーン座標変換（現在のanim値で）
  var _angle=animRotAngle;
  var cosA=Math.cos(_angle), sinA=Math.sin(_angle);
  var scaleX=animT/(T_STEPS[2]), scaleY=animH/(T_STEPS[2]*Math.sqrt(3)/2);
  function toScreen(gx, gy){
    // animGridOffX/Y, animT/H でのグリッド座標→キャンバス座標
    var px = animGridOffX + gx * animT/2;
    var py = animGridOffY + gy * animH;
    // 回転
    var dx=px-CW/2, dy=py-CH/2;
    return {
      x: CW/2 + cosA*dx - sinA*dy,
      y: CH/2 + sinA*dx + cosA*dy
    };
  }
  function getScreenVerts(c,r){
    // getVertsのグリッド座標をスクリーン座標に変換
    var x0=animGridOffX+c*(animT/2)-animT/2, y0=animGridOffY+r*animH;
    var pts;
    if((c+r)%2===0){
      pts=[ {x:x0+animT/2,y:y0}, {x:x0+animT,y:y0+animH}, {x:x0,y:y0+animH} ];
    } else {
      pts=[ {x:x0,y:y0}, {x:x0+animT,y:y0}, {x:x0+animT/2,y:y0+animH} ];
    }
    return pts.map(function(p){
      var dx=p.x-CW/2, dy=p.y-CH/2;
      return { x:CW/2+cosA*dx-sinA*dy, y:CH/2+sinA*dx+cosA*dy };
    });
  }

  // scatter canvas を用意
  var scatterCanvas=document.getElementById('scatterCanvas');
  scatterCanvas.width=CW; scatterCanvas.height=CH;
  var sctx=scatterCanvas.getContext('2d');

  var scatterPieces=[];
  pieces.forEach(function(piece){
    piece.keys.forEach(function(k){delete triMap[k];});
    var p0=piece.keys[0].split(',');
    var c0=+p0[0], r0=+p0[1];
    var sc=toScreen(
      animGridOffX + c0*(animT/2),
      animGridOffY + r0*animH
    );
    // 実際の中心はgetVertsから
    var allVerts=piece.keys.reduce(function(acc,k){
      var p=k.split(',');
      return acc.concat(getScreenVerts(+p[0],+p[1]));
    },[]);
    var cx=allVerts.reduce(function(s,v){return s+v.x;},0)/allVerts.length;
    var cy=allVerts.reduce(function(s,v){return s+v.y;},0)/allVerts.length;

    var angle=Math.random()*Math.PI*2;
    var spd=0.1+Math.random()*0.5;
    scatterPieces.push({
      keys:piece.keys, color:piece.color, removedAt:now,
      animMs:ANIM_MS,
      cx:cx, cy:cy,
      vx:Math.cos(angle)*spd,
      vy:Math.sin(angle)*spd,
      spin:(Math.random()-0.5)*0.1,
      screenVerts: piece.keys.map(function(k){
        var p=k.split(','); return getScreenVerts(+p[0],+p[1]);
      })
    });
  });

  pieces=[];history=[];triMap={};updateStats();
  renderWithAnim(); // 即座にcanvas1からピースを消す

  // カメラをリセット
  globalRotSteps=1;
  tIdx=2; T=T_STEPS[tIdx]; H=T*Math.sqrt(3)/2;
  snapToCenter();
  updateZoomButtons();
  var savedAnimRot=animRotAngle, savedAnimX=animGridOffX, savedAnimY=animGridOffY;
  var savedAnimT=animT, savedAnimH=animH;
  setTimeout(function(){
    animRotAngle=savedAnimRot; animGridOffX=savedAnimX; animGridOffY=savedAnimY;
    animT=savedAnimT; animH=savedAnimH;
    startClearReset(savedAnimRot, savedAnimX, savedAnimY, savedAnimT, 800);
  }, 200);

  // scatter animation on separate canvas
  var startTime=Date.now();
  (function scatterLoop(){
    var now2=Date.now();
    var elapsed=now2-startTime;
    sctx.clearRect(0,0,CW,CH);
    var any=false;
    scatterPieces.forEach(function(fp){
      var t=Math.min(elapsed/fp.animMs,1);
      var alpha=t>0.8?1-(t-0.8)/0.2:1;
      if(alpha<=0) return;
      any=true;
      var tx=fp.vx*elapsed*0.5+fp.vx*elapsed*elapsed*0.003;
      var ty=fp.vy*elapsed*0.5+fp.vy*elapsed*elapsed*0.003;
      var rot=fp.spin*elapsed*0.05+fp.spin*elapsed*elapsed*0.0003;
      sctx.save();
      sctx.globalAlpha=alpha;
      sctx.translate(fp.cx+tx, fp.cy+ty);
      sctx.rotate(rot);
      sctx.translate(-fp.cx, -fp.cy);
      fp.screenVerts.forEach(function(verts){
        sctx.beginPath();
        sctx.moveTo(verts[0].x,verts[0].y);
        sctx.lineTo(verts[1].x,verts[1].y);
        sctx.lineTo(verts[2].x,verts[2].y);
        sctx.closePath();
        sctx.fillStyle=fp.color; sctx.fill();
        sctx.strokeStyle='rgba(255,255,255,0.6)'; sctx.lineWidth=1; sctx.stroke();
      });
      sctx.restore();
    });
    if(any) requestAnimationFrame(scatterLoop);
    else sctx.clearRect(0,0,CW,CH);
  })();

  document.getElementById('ovConfirm').classList.remove('show');
});

var clearAnimLooping=false;
function clearAnimLoop(){
  var now=Date.now();
  fadingPieces=fadingPieces.filter(function(fp){
    return fp.clearAnim ? now-fp.removedAt<fp.animMs : now-fp.removedAt<FADE_MS;
  });
  renderWithAnim();
  if(fadingPieces.length) requestAnimationFrame(clearAnimLoop);
}

// ── Confetti ───────────────────────────────────────────────────
var confettiCanvas=document.getElementById('confettiCanvas');
var confetti=[];
var confettiGen=0; // increment to invalidate old loops

function launchConfetti(){
  var myGen=++confettiGen;
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
  confettiCanvas.style.display='block';
  var cc=confettiCanvas.getContext('2d');
  var colors=WOODS.map(function(w){return w.color;});
  var W=confettiCanvas.width, H2=confettiCanvas.height;
  var pieces2=[];
  for(var i=0;i<120;i++){
    var shape=Math.random()<0.5?'tri':'rh';
    var color=colors[Math.floor(Math.random()*colors.length)];
    var size=14+Math.random()*18;
    pieces2.push({
      x: Math.random()*W,
      y: -size - Math.random()*H2*0.5,
      vx: (Math.random()-0.5)*10,
      vy: 6+Math.random()*10,
      spin: (Math.random()-0.5)*0.15,
      angle: Math.random()*Math.PI*2,
      size: size, shape: shape, color: color,
      delay: Math.random()*400
    });
  }
  var startTime=Date.now();
  var lastTime=startTime;
  (function loop(){
    if(confettiGen!==myGen){ cc.clearRect(0,0,W,H2); return; }
    var now=Date.now();
    var elapsed=now-startTime;
    var dt=Math.min((now-lastTime)/16.67, 3); // delta in ~60fps units, capped
    lastTime=now;
    cc.clearRect(0,0,W,H2);
    var any=false;
    pieces2.forEach(function(p){
      if(elapsed<p.delay){any=true;return;}
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=0.2*dt; p.angle+=p.spin*dt;
      if(p.y<H2+50) any=true;
      drawConfettiPiece(cc,p);
    });
    if(any) requestAnimationFrame(loop);
    else confettiCanvas.style.display='none';
  })();
}

function drawConfettiPiece(c2d,p){
  if(p.y>confettiCanvas.height+50) return;
  c2d.save();
  c2d.translate(p.x,p.y);
  c2d.rotate(p.angle);
  c2d.fillStyle=p.color;
  c2d.strokeStyle='rgba(0,0,0,0.25)';
  c2d.lineWidth=0.6;
  var s=p.size, h=s*Math.sqrt(3)/2;
  c2d.beginPath();
  if(p.shape==='tri'){
    c2d.moveTo(0,-h*0.67); c2d.lineTo(s/2,h*0.33); c2d.lineTo(-s/2,h*0.33);
  } else {
    c2d.moveTo(-s/2,h/2); c2d.lineTo(s/4,h/2); c2d.lineTo(s/2,-h/2); c2d.lineTo(-s/4,-h/2);
  }
  c2d.closePath();
  c2d.fill(); c2d.stroke();
  c2d.restore();
}

// ── ロゴのプリロード ──────────────────────────────────────────
var logoImg=new Image();
logoImg.src='logo.png';
// 1 piece = 17 bits: c(6) r(6) wood(3) faceType(2)
// faceType: 0=tri, 1=rh0, 2=rh1, 3=rh2
// c,r stored as offset from grid center (c0,r0) in range -32..31

var SHARE_C0 = Math.round(CW/2 / (T/2));
var SHARE_R0 = Math.round(CH/2 / H);

function colorToWoodIndex(color){
  for(var i=0;i<WOODS.length;i++) if(WOODS[i].color===color) return i;
  return 0;
}

function rhDirFromKeys(keys){
  if(keys.length===1) return 0; // tri
  var c0=+keys[0].split(',')[0], r0=+keys[0].split(',')[1];
  var c1=+keys[1].split(',')[0], r1=+keys[1].split(',')[1];
  var up=isUp(c0,r0);
  var dc=c1-c0, dr=r1-r0;
  if(up){
    if(dc===1 &&dr===0) return 1; // rh0
    if(dc===0 &&dr===1) return 2; // rh1
    if(dc===-1&&dr===0) return 3; // rh2
  } else {
    if(dc===-1&&dr===0) return 1; // rh0
    if(dc===0 &&dr===-1)return 2; // rh1
    if(dc===1 &&dr===0) return 3; // rh2
  }
  return 0;
}

function encodePieces(pieces){
  // pack bits into Uint8Array
  var bits=[];
  pieces.forEach(function(piece){
    var c=+piece.keys[0].split(',')[0]-SHARE_C0;
    var r=+piece.keys[0].split(',')[1]-SHARE_R0;
    var wood=colorToWoodIndex(piece.color);
    var ft=rhDirFromKeys(piece.keys);
    // clamp to 6-bit signed
    c=Math.max(-32,Math.min(31,c));
    r=Math.max(-32,Math.min(31,r));
    // encode c as 6-bit two's complement
    var cv=(c+64)&63, rv=(r+64)&63;
    // push 17 bits: cv(6) rv(6) wood(3) ft(2)
    for(var i=5;i>=0;i--) bits.push((cv>>i)&1);
    for(var i=5;i>=0;i--) bits.push((rv>>i)&1);
    for(var i=2;i>=0;i--) bits.push((wood>>i)&1);
    for(var i=1;i>=0;i--) bits.push((ft>>i)&1);
  });
  // pad to byte boundary
  while(bits.length%6!==0) bits.push(0);
  // base64url using 6-bit chars
  var CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  var out='';
  for(var i=0;i<bits.length;i+=6){
    var v=0;
    for(var j=0;j<6;j++) v=(v<<1)|(bits[i+j]||0);
    out+=CHARS[v];
  }
  return out;
}

function decodePieces(str){
  var CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';
  var bits=[];
  for(var i=0;i<str.length;i++){
    var v=CHARS.indexOf(str[i]);
    if(v<0) continue;
    for(var j=5;j>=0;j--) bits.push((v>>j)&1);
  }
  var result=[];
  for(var i=0;i+16<bits.length;i+=17){
    var cv=0,rv=0,wood=0,ft=0;
    for(var j=0;j<6;j++) cv=(cv<<1)|bits[i+j];
    for(var j=0;j<6;j++) rv=(rv<<1)|bits[i+6+j];
    for(var j=0;j<3;j++) wood=(wood<<1)|bits[i+12+j];
    for(var j=0;j<2;j++) ft=(ft<<1)|bits[i+15+j];
    // decode signed 6-bit
    var c=(cv>=32?cv-64:cv)+SHARE_C0;
    var r=(rv>=32?rv-64:rv)+SHARE_R0;
    if(wood<0||wood>=WOODS.length) continue;
    var color=WOODS[wood].color;
    var keys,type;
    if(ft===0){
      keys=[c+','+r]; type='tri';
    } else {
      var dir=['','rh0','rh1','rh2'][ft];
      var pair=getRhPair(c,r,dir);
      keys=pair.map(function(p){return p.col+','+p.row;});
      type='rhombus';
    }
    result.push({id:nextId++,type:type,keys:keys,color:color});
  }
  return result;
}

var SHARE_CHARS='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_';

function encodeState(){
  // rot(4) tIdx(3) offX(6 signed) offY(6 signed) = 19 bits -> 4 chars (24 bits)
  var offXcol = Math.round((CW/2 - gridOffX) / (T/2));
  var offYrow  = Math.round((CH/2 - gridOffY) / H);
  // clamp to 6-bit signed -32..31
  offXcol = Math.max(-32, Math.min(31, offXcol));
  offYrow  = Math.max(-32, Math.min(31, offYrow));
  var bits=[];
  var rot=((globalRotSteps%12)+12)%12;
  for(var i=3;i>=0;i--) bits.push((rot>>i)&1);
  for(var i=2;i>=0;i--) bits.push((tIdx>>i)&1);
  var cx=(offXcol+64)&63, cy=(offYrow+64)&63;
  for(var i=5;i>=0;i--) bits.push((cx>>i)&1);
  for(var i=5;i>=0;i--) bits.push((cy>>i)&1);
  // pad to 24 bits
  while(bits.length<24) bits.push(0);
  var out='';
  for(var i=0;i<24;i+=6){
    var v=0; for(var j=0;j<6;j++) v=(v<<1)|bits[i+j];
    out+=SHARE_CHARS[v];
  }
  return out;
}

function decodeState(str){
  var bits=[];
  for(var i=0;i<str.length;i++){
    var v=SHARE_CHARS.indexOf(str[i]); if(v<0) continue;
    for(var j=5;j>=0;j--) bits.push((v>>j)&1);
  }
  if(bits.length<19) return null;
  var rot=0; for(var i=0;i<4;i++) rot=(rot<<1)|bits[i];
  var zi=0;  for(var i=0;i<3;i++) zi=(zi<<1)|bits[4+i];
  var cx=0;  for(var i=0;i<6;i++) cx=(cx<<1)|bits[7+i];
  var cy=0;  for(var i=0;i<6;i++) cy=(cy<<1)|bits[13+i];
  var offXcol = (cx>=32?cx-64:cx);
  var offYrow  = (cy>=32?cy-64:cy);
  return {rot:((rot%12)+12)%12, tIdx:Math.max(0,Math.min(4,zi)), offXcol:offXcol, offYrow:offYrow};
}

function getShareUrl(){
  var s=encodeState();
  var d=encodePieces(pieces);
  return location.origin+location.pathname+'?v='+s+d;
}

function loadFromUrl(){
  var mv=location.search.match(/[?&]v=([A-Za-z0-9\-_]+)/);
  if(!mv) return;
  var val=mv[1];
  if(val.length<4) return;
  var s=val.slice(0,4);
  var d=val.slice(4);
  var st=decodeState(s);
  if(st){
    globalRotSteps=st.rot;
    tIdx=st.tIdx;
    T=T_STEPS[tIdx]; H=T*Math.sqrt(3)/2;
    COLS=Math.ceil(1800/(T/2))+4;
    ROWS=Math.ceil(1800/H)+4;
    gridOffX=CW/2-st.offXcol*(T/2);
    gridOffY=CH/2-st.offYrow*H;
    animRotAngle=globalRotSteps*Math.PI/6;
    animT=T; animH=H;
    animGridOffX=gridOffX; animGridOffY=gridOffY;
  }
  if(!d) return;
  var loaded=decodePieces(d);
  // シャッフル
  for(var i=loaded.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var tmp=loaded[i]; loaded[i]=loaded[j]; loaded[j]=tmp;
  }
  // 30msごとに1つずつ追加
  var total = loaded.length;
  var duration = 1200;
  loaded.forEach(function(piece, idx){
    var delay = total > 1 ? Math.round(idx/(total-1)*duration) : 0;
    if(idx === total-1) delay = duration;
    setTimeout(function(){
      var blocked=false;
      piece.keys.forEach(function(k){ if(triMap[k]) blocked=true; });
      if(blocked) return;
      piece.keys.forEach(function(k){ triMap[k]=piece.color; }); // 仮登録
      fadingPieces.push({
        keys:piece.keys, color:piece.color,
        removedAt:Date.now(), fadeIn:true, scaleIn:true, piece:piece
      });
      requestAnimationFrame(fadeLoop);
    }, delay);
  });
}
