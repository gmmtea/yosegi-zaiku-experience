<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>箱根寄木細工体験</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700&family=Shippori+Mincho:wght@700&display=swap');
:root{--paper:#f5ede0;--wl:#e8d5b7;--wm:#c9a96e;--wd:#8b5e3c;--wdp:#4a2c1a;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--paper);color:var(--wdp);font-family:'Noto Serif JP',serif;min-height:100vh;user-select:none;}

header{text-align:center;padding:14px 20px 10px;border-bottom:2px solid var(--wm);}
h1{font-family:'Shippori Mincho',serif;font-size:clamp(28px,7vw,52px);letter-spacing:.15em;}

.wrap{max-width:600px;margin:0 auto;padding:12px 10px 28px;}

/* Palette + eraser layout */
.palette-area{display:flex;gap:6px;align-items:stretch;margin-bottom:12px;}
.palette-rows{display:flex;flex-direction:column;gap:6px;flex:1;}
.palette-grid{display:flex;gap:6px;}

.p-cell{
  flex:1;
  display:flex;align-items:center;justify-content:center;
  padding:8px 2px;
  border:2px solid var(--wm);background:white;border-radius:5px;
  cursor:pointer;transition:border-color .1s,background .1s;
}
.p-cell:hover{border-color:var(--wd);background:#fdf6ec;}
.p-cell.selected{border-color:var(--wd);background:var(--wl);box-shadow:0 0 0 2px var(--wd);}
.p-cell svg{width:100%;height:auto;display:block;pointer-events:none;max-width:70px;}

/* Eraser button: spans both rows */
.eraser-btn{
  width:60px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  border:2px solid var(--wm);background:white;border-radius:5px;
  cursor:pointer;transition:border-color .1s,background .1s;
  font-size:28px;
  padding:6px 0;
}
.eraser-btn:hover{border-color:var(--wd);background:#fdf6ec;}
.eraser-btn.selected{border-color:var(--wd);background:var(--wl);box-shadow:0 0 0 2px var(--wd);}
.eraser-lbl{font-size:clamp(13px,3vw,19px);color:var(--wd);font-family:'Noto Serif JP',serif;}

/* ── CANVAS WRAPPER: full width, relative for overlaid buttons ── */
.canvas-wrap{
  position:relative;
  width:100%;
  margin-bottom:10px;
}
.cbox{
  background:#fff8f0;
  border:1px solid var(--wm);
  box-shadow:3px 3px 0 var(--wm),6px 6px 0 rgba(139,94,60,.15);
  border-radius:2px;overflow:hidden;
  width:100%;
}
canvas{display:block;touch-action:none;width:100% !important;height:auto !important;}

/* Rotation buttons overlaid on bottom corners of canvas */
.rot-btn{
  position:absolute;bottom:10px;
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.rot-btn:hover{border-color:var(--wd);background:var(--wl);}
#rotL{left:10px;}
#rotR{right:10px;}

/* Zoom buttons: just above rotation buttons */
.zoom-btn{
  position:absolute;bottom:clamp(56px,11vw,72px);
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.zoom-btn:hover{border-color:var(--wd);background:var(--wl);}
.zoom-btn:disabled{opacity:0.3;pointer-events:none;background:white;border-color:var(--wm);}

/* Move buttons at canvas edges */
.move-btn{
  position:absolute;
  width:clamp(40px,7vw,52px);height:clamp(40px,7vw,52px);
  border:1.5px solid var(--wm);
  background:rgba(255,248,240,0.92);
  backdrop-filter:blur(2px);
  cursor:pointer;border-radius:6px;font-size:clamp(20px,4.5vw,26px);color:var(--wd);
  transition:all .1s;
  display:flex;align-items:center;justify-content:center;
  z-index:10;
}
.move-btn:hover{border-color:var(--wd);background:var(--wl);}

/* ── STATS + BOTTOM ── */
.stats-row{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:10px;}
.pb-wrap{width:240px;height:7px;background:var(--wl);border-radius:4px;overflow:hidden;}
.pf{height:100%;background:var(--wd);border-radius:4px;transition:width .3s;}
.piece-count{font-size:22px;color:var(--wd);white-space:nowrap;}
.bottom-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:center;}
.btn{
  flex:1;
  padding:14px 10px;border:none;cursor:pointer;
  font-family:'Noto Serif JP',serif;font-size:clamp(15px,3.5vw,22px);
  border-radius:4px;transition:all .15s;
}
.btn-p{background:var(--wd);color:var(--paper);}
.btn-p:hover{background:var(--wdp);}
.btn-s{background:transparent;color:var(--wd);border:1.5px solid var(--wm);}
.btn-s:hover{border-color:var(--wd);background:var(--wl);}

/* Modal */
.ov{display:none;position:fixed;inset:0;background:rgba(74,44,26,.85);z-index:200;align-items:center;justify-content:center;}
.ov.show{display:flex;}
.mc{background:var(--paper);padding:28px;text-align:center;max-width:440px;width:90%;border-radius:4px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
.mct{font-family:'Shippori Mincho',serif;font-size:30px;margin-bottom:6px;}
.mcs{font-size:16px;color:var(--wd);margin-bottom:14px;line-height:1.8;}
</style>
</head>
<body>
<header>
  <h1>箱根寄木細工体験</h1>
  <p style="font-size:clamp(11px,2vw,14px);color:var(--wd);margin-top:4px;opacity:.8;"><a href="https://www.kanazashi-woodcraft.com/information.html" target="_blank" style="color:var(--wd);text-decoration:none;border-bottom:1px solid var(--wm);">箱根寄木細工のコースター作り</a>に向けて、デザインを考えてみましょう。</p>
</header>

<div class="wrap">
  <!-- Wood name header: offset by eraser width -->
  <div style="display:flex;gap:6px;margin-bottom:5px;align-items:flex-end;">
    <div style="display:flex;gap:6px;flex:1;align-items:flex-end;" id="woodNames"></div>
    <div style="width:60px;flex-shrink:0;"></div>
  </div>

  <!-- Palette: tri/rhombus rows + eraser -->
  <div class="palette-area">
    <div class="palette-rows">
      <div class="palette-grid" id="palTri"></div>
      <div class="palette-grid" id="palRh"></div>
    </div>
    <button class="eraser-btn" id="btnEraser">
      <span>🧹</span>
      <span class="eraser-lbl">消去</span>
    </button>
  </div>

  <!-- Canvas: full width, rot + zoom buttons overlaid -->
  <div class="canvas-wrap">
    <div class="cbox"><canvas id="c"></canvas></div>
    <button class="rot-btn" id="rotL">↺</button>
    <button class="rot-btn" id="rotR">↻</button>
    <button class="zoom-btn" id="zoomOut" style="left:10px;">－</button>
    <button class="zoom-btn" id="zoomIn"  style="right:10px;">＋</button>
    <!-- Move buttons at edges -->
    <button class="move-btn" id="moveUp"    style="top:10px;left:50%;transform:translateX(-50%);">↑</button>
    <button class="move-btn" id="moveDown"  style="bottom:10px;left:50%;transform:translateX(-50%);">↓</button>
    <button class="move-btn" id="moveLeft"  style="left:10px;top:50%;transform:translateY(-50%);">←</button>
    <button class="move-btn" id="moveRight" style="right:10px;top:50%;transform:translateY(-50%);">→</button>
  </div>

  <!-- Stats -->
  <div class="stats-row">
    <span class="piece-count">ピース: <strong id="cnt">0</strong> / 40</span>
    <div class="pb-wrap"><div class="pf" id="pf" style="width:0%"></div></div>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <button class="btn btn-s" id="btnUndo">↩ 一つ戻す</button>
    <button class="btn btn-s" id="btnClear">✕ 全消去</button>
    <button class="btn btn-p" id="btnDone">完成！</button>
  </div>

  <!-- Footer -->
  <footer style="text-align:center;margin-top:20px;padding-bottom:8px;">
    <a href="https://www.kanazashi-woodcraft.com/information.html" target="_blank"
       style="font-size:13px;color:var(--wd);text-decoration:none;border-bottom:1px solid var(--wm);padding-bottom:2px;">
      金指ウッドクラフトで寄木体験を予約する →
    </a>
  </footer>
</div>

<!-- Confirm clear modal -->
<canvas id="confettiCanvas" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:300;display:none;"></canvas>
<div class="ov" id="ovConfirm">
  <div class="mc">
    <div class="mct">全消去しますか？</div>
    <div class="mcs">置いたピースがすべて消えます。</div>
    <button class="btn btn-p" id="btnConfirmYes" style="margin-bottom:10px;width:100%">消去する</button><br>
    <button class="btn btn-s" id="btnConfirmNo" style="width:100%">キャンセル</button>
  </div>
</div>

<div class="ov" id="ov">
  <div class="mc">
    <div class="mct">完成！</div>
    <div class="mcs">このデザインを<a href="https://www.kanazashi-woodcraft.com/information.html" target="_blank" style="color:var(--wd);text-decoration:none;border-bottom:1px solid var(--wm);">寄木体験</a>で形にしましょう。</div>
    <canvas id="thumb" style="max-width:100%;border:2px solid var(--wm);margin-bottom:14px;display:block;margin-left:auto;margin-right:auto;"></canvas>
    <div style="display:flex;gap:8px;margin-bottom:14px;">
      <button class="btn btn-p" id="btnDl" style="flex:1">画像を保存</button>
      <button class="btn btn-s" id="btnClose" style="flex:1">続けて作る</button>
    </div>
    <a href="https://www.kanazashi-woodcraft.com/information.html" target="_blank"
       style="font-size:13px;color:var(--wd);text-decoration:none;border-bottom:1px solid var(--wm);padding-bottom:2px;">
      金指ウッドクラフトで寄木体験を予約する →
    </a>
  </div>
</div>

<script>
(function(){

var WOODS=[
  {jp:'ミズキ',         color:'#e8d8bb'},
  {jp:'ホオノキ',       color:'#bfa96e'},
  {jp:'ウルシ',         color:'#c8a800'},
  {jp:'チャン\nチン',   color:'#c85a3a'},
  {jp:'ウォール\nナット',color:'#6a5858'},
];

var globalRotSteps = 1; // 30° default: vertical lines
var pieces  = [];
var triMap  = {};
var nextId  = 1;
var history = []; // [{action:'add'|'remove', piece}]
var selShape= null, selColor=null, selCell=null, hoverDir='rh0';
var eraserMode=false;
var warnCells={}, WARN_MS=600;
var fadingPieces=[];
var FADE_MS=100;

// ── Grid ──────────────────────────────────────────────────────
var T    = 104;
var H    = T*Math.sqrt(3)/2;
var PAD  = 4;
var CW   = 900;
var CH   = 900;
// COLS/ROWS: enough to cover canvas diagonal when rotated (diagonal = CW*√2 ≈ 1273)
var COLS = Math.ceil(1800/(T/2))+4;
var ROWS = Math.ceil(1800/H)+4;

function snapToCenter(){
  gridOffX = CW/2 - Math.round((CW/2)/(T/2)) * (T/2);
  gridOffY = CH/2 - Math.round((CH/2)/H) * H;
}
var gridOffX=0, gridOffY=0;
snapToCenter();

var canvas=document.getElementById('c');
var ctx=canvas.getContext('2d');
canvas.width=CW; canvas.height=CH;
// CSS handles display size via width:100%

// ── Geometry ──────────────────────────────────────────────────
function isUp(c,r){return(c+r)%2===0;}
function getVerts(c,r){
  // x0, y0: top-left corner of this triangle's bounding cell
  // Up-tri:   apex=(x0+T/2, y0), BL=(x0, y0+H), BR=(x0+T, y0+H)
  // Down-tri: TL=(x0, y0), TR=(x0+T, y0), apex=(x0+T/2, y0+H)
  // Vertices land on: x = gridOffX + n*(T/2), y = gridOffY + m*H
  // x0 = gridOffX + c*(T/2) - T/2  so apex of up-tri = gridOffX + c*(T/2)
  var x0 = gridOffX + c*(T/2) - T/2;
  var y0 = gridOffY + r*H;
  if(isUp(c,r)) return [{x:x0+T/2,y:y0},{x:x0+T,y:y0+H},{x:x0,y:y0+H}];
  return [{x:x0,y:y0},{x:x0+T,y:y0},{x:x0+T/2,y:y0+H}];
}
function getCenter(c,r){
  var v=getVerts(c,r);
  return{x:(v[0].x+v[1].x+v[2].x)/3,y:(v[0].y+v[1].y+v[2].y)/3};
}
function cellInGrid(c,r){ return true; }
function sign3(ax,ay,bx,by,cx,cy){return(ax-cx)*(by-cy)-(bx-cx)*(ay-cy);}
function ptInTri(px,py,v){
  var d1=sign3(px,py,v[0].x,v[0].y,v[1].x,v[1].y);
  var d2=sign3(px,py,v[1].x,v[1].y,v[2].x,v[2].y);
  var d3=sign3(px,py,v[2].x,v[2].y,v[0].x,v[0].y);
  return!((d1<0||d2<0||d3<0)&&(d1>0||d2>0||d3>0));
}
function hitTest(px,py){
  var ac=Math.floor((px-gridOffX)/(T/2)), ar=Math.floor((py-gridOffY)/H);
  for(var dr=-1;dr<=1;dr++) for(var dc=-2;dc<=2;dc++){
    var c=ac+dc,r=ar+dr;
    if(!cellInGrid(c,r)) continue;
    if(ptInTri(px,py,getVerts(c,r))) return{col:c,row:r};
  }
  return null;
}

// ── Rhombus ────────────────────────────────────────────────────
function getRhPair(c,r,dir){
  var up=isUp(c,r),p;
  if(dir==='rh0') p=up?{col:c+1,row:r}:{col:c-1,row:r};
  else if(dir==='rh1') p=up?{col:c,row:r+1}:{col:c,row:r-1};
  else p=up?{col:c-1,row:r}:{col:c+1,row:r};
  return[{col:c,row:r},p];
}
function bestRhDir(c,r,px,py){
  var v=getVerts(c,r),up=isUp(c,r);
  var mids=[
    {mx:(v[0].x+v[1].x)/2,my:(v[0].y+v[1].y)/2},
    {mx:(v[1].x+v[2].x)/2,my:(v[1].y+v[2].y)/2},
    {mx:(v[2].x+v[0].x)/2,my:(v[2].y+v[0].y)/2},
  ];
  var best=0,bd=Infinity;
  for(var i=0;i<3;i++){var dx=mids[i].mx-px,dy=mids[i].my-py,d=dx*dx+dy*dy;if(d<bd){bd=d;best=i;}}
  if(up) return['rh0','rh1','rh2'][best];
  return['rh1','rh2','rh0'][best];
}

// ── Canvas coord (undo rotation) ──────────────────────────────
function canvasPos(e){
  var rect=canvas.getBoundingClientRect();
  var sx=CW/rect.width,sy=CH/rect.height;
  var ex=(e.clientX!==undefined?e.clientX:e.touches[0].clientX)-rect.left;
  var ey=(e.clientY!==undefined?e.clientY:e.touches[0].clientY)-rect.top;
  var cx=ex*sx,cy=ey*sy;
  var a=globalRotSteps*Math.PI/6;
  var dx=cx-CW/2,dy=cy-CH/2;
  var co=Math.cos(-a),si=Math.sin(-a);
  return{x:co*dx-si*dy+CW/2,y:si*dx+co*dy+CH/2};
}

// ── Drawing ────────────────────────────────────────────────────
function luma(hex){
  return.299*parseInt(hex.slice(1,3),16)+.587*parseInt(hex.slice(3,5),16)+.114*parseInt(hex.slice(5,7),16);
}
function fillTri(c2d,v,color){
  c2d.beginPath();
  c2d.moveTo(v[0].x,v[0].y);c2d.lineTo(v[1].x,v[1].y);c2d.lineTo(v[2].x,v[2].y);
  c2d.closePath();c2d.fillStyle=color;c2d.fill();
  c2d.save();c2d.clip();
  c2d.strokeStyle=luma(color)>100?'rgba(0,0,0,0.06)':'rgba(255,255,255,0.04)';
  c2d.lineWidth=0.7;
  for(var i=-80;i<80;i+=5){c2d.beginPath();c2d.moveTo(-80+i,-80);c2d.lineTo(80+i,80);c2d.stroke();}
  c2d.restore();
}
function drawPieceBorder(c2d,cells){
  var eps=0.5;
  function ek(a,b){
    var ka=Math.round(a.x/eps)+','+Math.round(a.y/eps);
    var kb=Math.round(b.x/eps)+','+Math.round(b.y/eps);
    return ka<kb?ka+'|'+kb:kb+'|'+ka;
  }
  var cnt={},dat={};
  cells.forEach(function(cc){
    var v=getVerts(cc.col,cc.row);
    [[v[0],v[1]],[v[1],v[2]],[v[2],v[0]]].forEach(function(e){
      var k=ek(e[0],e[1]);cnt[k]=(cnt[k]||0)+1;dat[k]=e;
    });
  });
  c2d.strokeStyle='rgba(255,255,255,0.6)';c2d.lineWidth=1.0;c2d.lineCap='round';
  for(var k in cnt){
    if(cnt[k]===1){var e=dat[k];c2d.beginPath();c2d.moveTo(e[0].x,e[0].y);c2d.lineTo(e[1].x,e[1].y);c2d.stroke();}
  }
}
function getPreviewCells(cell,shape,dir){
  if(!cell) return[];
  if(shape==='tri') return[{col:cell.col,row:cell.row}];
  return getRhPair(cell.col,cell.row,dir).filter(function(cc){return cc&&cellInGrid(cc.col,cc.row);});
}

// ── Render ─────────────────────────────────────────────────────
function render(){ renderWithAnim(); }

function animateWarns(){
  var now=Date.now(),any=false;
  for(var k in warnCells){if(now-warnCells[k]<WARN_MS){any=true;break;}}
  if(any){render();requestAnimationFrame(animateWarns);}
}

// ── Palette ────────────────────────────────────────────────────
var woodNamesEl=document.getElementById('woodNames');
WOODS.forEach(function(w){
  var el=document.createElement('div');
  el.style.cssText='flex:1;font-size:clamp(13px,3vw,19px);color:#8b5e3c;text-align:center;white-space:pre;line-height:1.4;display:flex;align-items:flex-end;justify-content:center;';
  el.textContent=w.jp;
  woodNamesEl.appendChild(el);
});

function makeSVG(shape,color){
  var s='rgba(255,255,255,0.7)';
  if(shape==='tri')
    return '<svg viewBox="0 0 54 31.2" xmlns="http://www.w3.org/2000/svg"><path d="M27,0 L45,31.2 L9,31.2 Z" fill="'+color+'" stroke="'+s+'" stroke-width="0.8" stroke-linejoin="round"/></svg>';
  return '<svg viewBox="0 0 54 31.2" xmlns="http://www.w3.org/2000/svg"><path d="M18,0 L54,0 L36,31.2 L0,31.2 Z" fill="'+color+'" stroke="'+s+'" stroke-width="0.8" stroke-linejoin="round"/></svg>';
}

function makePaletteCell(shape,wood){
  var cell=document.createElement('div');
  cell.className='p-cell';
  cell.innerHTML=makeSVG(shape,wood.color);
  cell.addEventListener('click',function(){
    selShape=shape;selColor=wood.color;
    eraserMode=false;
    document.getElementById('btnEraser').classList.remove('selected');
    document.querySelectorAll('.p-cell').forEach(function(c){c.classList.remove('selected');});
    cell.classList.add('selected');canvas.style.cursor='crosshair';
  });
  return cell;
}

var palTri=document.getElementById('palTri');
var palRh=document.getElementById('palRh');
WOODS.forEach(function(w){
  palTri.appendChild(makePaletteCell('tri',w));
  palRh.appendChild(makePaletteCell('rhombus',w));
});

// Eraser button
document.getElementById('btnEraser').addEventListener('click',function(){
  eraserMode=!eraserMode;
  if(eraserMode){
    selShape=null;selColor=null;selCell=null;
    document.querySelectorAll('.p-cell').forEach(function(c){c.classList.remove('selected');});
    this.classList.add('selected');
    canvas.style.cursor='cell';
  } else {
    this.classList.remove('selected');
    canvas.style.cursor='default';
  }
  render();
});

// ── Pointer events ─────────────────────────────────────────────
// Hover: update selCell and hoverDir on mousemove
canvas.addEventListener('mousemove',function(e){
  if(!selShape) return;
  var p=canvasPos(e);
  selCell=hitTest(p.x,p.y);
  if(selCell&&selShape==='rhombus') hoverDir=bestRhDir(selCell.col,selCell.row,p.x,p.y);
  render();
});

canvas.addEventListener('mouseleave',function(){selCell=null;render();});

// Touch: update hover on touchmove
canvas.addEventListener('touchmove',function(e){
  e.preventDefault();
  if(!selShape) return;
  var p=canvasPos(e);
  selCell=hitTest(p.x,p.y);
  if(selCell&&selShape==='rhombus') hoverDir=bestRhDir(selCell.col,selCell.row,p.x,p.y);
  render();
},{passive:false});

// Click / tap to place or erase
canvas.addEventListener('click',function(e){
  var p=canvasPos(e),cell=hitTest(p.x,p.y);if(!cell) return;
  if(eraserMode){
    removePieceAt(cell.col,cell.row);return;
  }
  if(!selShape) return;
  if(selShape==='rhombus') hoverDir=bestRhDir(cell.col,cell.row,p.x,p.y);
  doPlace(cell.col,cell.row);startAnim();
});

// Right-click to remove
canvas.addEventListener('contextmenu',function(e){
  e.preventDefault();
  var p=canvasPos(e),cell=hitTest(p.x,p.y);if(!cell) return;
  removePieceAt(cell.col,cell.row);
});

function removePieceAt(col,row){
  var key=col+','+row;
  for(var i=pieces.length-1;i>=0;i--){
    if(pieces[i].keys.indexOf(key)>=0){
      var piece=pieces[i];
      piece.keys.forEach(function(k){delete triMap[k];});
      pieces.splice(i,1);
      history.push({action:'remove',piece:piece});
      fadingPieces.push({keys:piece.keys,color:piece.color,removedAt:Date.now()});
      updateStats();
      requestAnimationFrame(fadeLoop);
      return;
    }
  }
}

function fadeLoop(){
  var now=Date.now();
  fadingPieces=fadingPieces.filter(function(fp){
    var done = now-fp.removedAt >= FADE_MS;
    if(done && fp.fadeIn && fp.piece){
      // fadeIn complete: now add to pieces for real
      pieces.push(fp.piece);
      fp.piece.keys.forEach(function(k){triMap[k]=fp.piece.color;});
      updateStats();
    }
    return !done;
  });
  renderWithAnim();
  if(fadingPieces.length) requestAnimationFrame(fadeLoop);
}

function doPlace(col,row){
  var cells=selShape==='tri'
    ?[{col:col,row:row}]
    :getRhPair(col,row,hoverDir).filter(function(cc){return cc&&cellInGrid(cc.col,cc.row);});
  if(!cells.length) return;
  var blocked=false;
  cells.forEach(function(cc){
    if(triMap[cc.col+','+cc.row]){blocked=true;warnCells[cc.col+','+cc.row]=Date.now();}
  });
  if(blocked){requestAnimationFrame(animateWarns);return;}
  var keys=cells.map(function(cc){return cc.col+','+cc.row;});
  var piece={id:nextId++,type:selShape,keys:keys,color:selColor};
  pieces.push(piece);
  keys.forEach(function(k){triMap[k]=selColor;});
  history.push({action:'add',piece:piece});
  updateStats();
}

function updateStats(){
  var n=pieces.length;
  document.getElementById('cnt').textContent=n;
  document.getElementById('pf').style.width=Math.min(n/40*100,100)+'%';
}

// ── Animation ──────────────────────────────────────────────────
// Current animated values
var animRotAngle = globalRotSteps * Math.PI / 6; // actual drawn angle
var animGridOffX = gridOffX;
var animGridOffY = gridOffY;
var animT        = T;
var animH        = H;
var animating    = false;
var LERP         = 0.18; // smoothing factor (0=instant, 1=no movement)

function lerp(a, b, t){ return a + (b - a) * t; }

function animLoop(){
  var targetAngle = globalRotSteps * Math.PI / 6;
  // Shortest path for rotation
  var da = targetAngle - animRotAngle;
  while(da >  Math.PI) da -= Math.PI*2;
  while(da < -Math.PI) da += Math.PI*2;
  animRotAngle += da * LERP;

  animGridOffX = lerp(animGridOffX, gridOffX, LERP);
  animGridOffY = lerp(animGridOffY, gridOffY, LERP);
  animT        = lerp(animT, T, LERP);
  animH        = animT * Math.sqrt(3) / 2;

  var done = Math.abs(da) < 0.001
          && Math.abs(animGridOffX - gridOffX) < 0.2
          && Math.abs(animGridOffY - gridOffY) < 0.2
          && Math.abs(animT - T) < 0.2;

  renderWithAnim();

  if(!done) requestAnimationFrame(animLoop);
  else {
    animRotAngle = targetAngle;
    animGridOffX = gridOffX;
    animGridOffY = gridOffY;
    animT = T; animH = H;
    animating = false;
    renderWithAnim();
  }
}

function startAnim(){
  if(!animating){ animating=true; requestAnimationFrame(animLoop); }
}

// renderWithAnim uses animated values instead of live values
function renderWithAnim(){
  var savedRotSteps = globalRotSteps;
  var savedOffX = gridOffX, savedOffY = gridOffY;
  var savedT = T, savedH = H;

  // Temporarily override with animated values
  var _angle = animRotAngle;
  gridOffX = animGridOffX; gridOffY = animGridOffY;
  T = animT; H = animH;
  COLS = Math.ceil(1800/(T/2))+4;
  ROWS = Math.ceil(1800/H)+4;

  ctx.clearRect(0,0,CW,CH);
  ctx.save();
  ctx.translate(CW/2,CH/2); ctx.rotate(_angle); ctx.translate(-CW/2,-CH/2);

  ctx.fillStyle='#e8ebe6'; ctx.fillRect(-CW,-CH,CW*3,CH*3);

  var margin = Math.ceil(CW*1.5/(T/2));
  var cStart = Math.floor(-gridOffX/(T/2))-margin;
  var cEnd   = Math.ceil((CW-gridOffX)/(T/2))+margin;
  var rStart = Math.floor(-gridOffY/H)-margin;
  var rEnd   = Math.ceil((CH-gridOffY)/H)+margin;
  for(var r=rStart;r<rEnd;r++) for(var c=cStart;c<cEnd;c++){
    var v=getVerts(c,r);
    ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);ctx.lineTo(v[1].x,v[1].y);ctx.lineTo(v[2].x,v[2].y);ctx.closePath();
    ctx.strokeStyle='rgba(100,120,100,0.25)';ctx.lineWidth=1.0;ctx.stroke();
  }

  pieces.forEach(function(piece){
    piece.keys.forEach(function(key){
      var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),piece.color);
    });
  });
  pieces.forEach(function(piece){
    var cells=piece.keys.map(function(k){var p=k.split(',');return{col:+p[0],row:+p[1]};});
    drawPieceBorder(ctx,cells);
  });

  // fading pieces (deleted, fading out)
  var now2=Date.now();
  fadingPieces.forEach(function(fp){
    var elapsed=now2-fp.removedAt;

    if(!fp.clearAnim){
      // Normal fade in/out
      var t=elapsed/FADE_MS;
      var alpha=fp.fadeIn ? Math.min(t,1)*0.9 : (1-Math.min(t,1))*0.9;
      if(alpha<=0) return;
      ctx.globalAlpha=alpha;
      fp.keys.forEach(function(key){
        var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),fp.color);
      });
      var cells=fp.keys.map(function(k){var p=k.split(',');return{col:+p[0],row:+p[1]};});
      drawPieceBorder(ctx,cells);
      ctx.globalAlpha=1;
      return;
    }

    // Scatter animation
    var t=Math.min(elapsed/fp.animMs,1);
    var alpha=t>0.8 ? 1-(t-0.8)/0.2 : 1;
    if(alpha<=0) return;

    var tx=fp.vx*elapsed*0.5 + fp.vx*elapsed*elapsed*0.003;
    var ty=fp.vy*elapsed*0.5 + fp.vy*elapsed*elapsed*0.003;
    var rot=fp.spin*elapsed*0.05 + fp.spin*elapsed*elapsed*0.0003;

    ctx.save();
    ctx.globalAlpha=alpha;
    ctx.translate(fp.cx+tx, fp.cy+ty);
    ctx.rotate(rot);
    ctx.translate(-fp.cx, -fp.cy);
    fp.keys.forEach(function(key){
      var p=key.split(','); fillTri(ctx,getVerts(+p[0],+p[1]),fp.color);
    });
    ctx.restore();
  });

  var now=Date.now();
  for(var key in warnCells){
    if(now-warnCells[key]<WARN_MS){
      var p=key.split(','),v=getVerts(+p[0],+p[1]);
      var al=0.5*(1-(now-warnCells[key])/WARN_MS);
      ctx.save();ctx.globalAlpha=al;
      ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);ctx.lineTo(v[1].x,v[1].y);ctx.lineTo(v[2].x,v[2].y);ctx.closePath();
      ctx.fillStyle='#ff3333';ctx.fill();ctx.restore();
    } else { delete warnCells[key]; }
  }

  if(selShape&&selCell){
    var pcells=getPreviewCells(selCell,selShape,hoverDir);
    ctx.globalAlpha=0.45;
    pcells.forEach(function(cc){fillTri(ctx,getVerts(cc.col,cc.row),selColor);});
    ctx.globalAlpha=1;
    drawPieceBorder(ctx,pcells);
  }

  ctx.restore();

  // Restore live values
  gridOffX=savedOffX; gridOffY=savedOffY; T=savedT; H=savedH;
  COLS=Math.ceil(1800/(T/2))+4; ROWS=Math.ceil(1800/H)+4;
}
document.getElementById('rotL').addEventListener('click',function(){globalRotSteps=(globalRotSteps-1+12)%12;startAnim();});
document.getElementById('rotR').addEventListener('click',function(){globalRotSteps=(globalRotSteps+1)%12;startAnim();});

// Zoom: 5 steps, 88 is center (index 2)
var T_STEPS=[56,80,104,128,152];
var tIdx=2; // default T=104

function applyZoom(newT){
  var fx = (CW/2 - gridOffX) / (T/2);
  var fy = (CH/2 - gridOffY) / H;
  T = newT;
  H = T*Math.sqrt(3)/2;
  COLS = Math.ceil(1800/(T/2))+4;
  ROWS = Math.ceil(1800/H)+4;
  gridOffX = CW/2 - fx * (T/2);
  gridOffY = CH/2 - fy * H;
  startAnim();
}

// Move
function moveGrid(dx_screen, dy_screen){
  var a = globalRotSteps * Math.PI / 6;
  var co = Math.cos(-a), si = Math.sin(-a);
  gridOffX += (co*dx_screen - si*dy_screen) * T;
  gridOffY += (si*dx_screen + co*dy_screen) * T;
  startAnim();
}
document.getElementById('moveUp').addEventListener('click',    function(){ moveGrid( 0,  1); });
document.getElementById('moveDown').addEventListener('click',  function(){ moveGrid( 0, -1); });
document.getElementById('moveLeft').addEventListener('click',  function(){ moveGrid( 1,  0); });
document.getElementById('moveRight').addEventListener('click', function(){ moveGrid(-1,  0); });

function updateZoomButtons(){
  document.getElementById('zoomIn').disabled  = tIdx>=T_STEPS.length-1;
  document.getElementById('zoomOut').disabled = tIdx<=0;
}

document.getElementById('zoomIn').addEventListener('click',function(){
  if(tIdx>=T_STEPS.length-1) return;
  tIdx++; applyZoom(T_STEPS[tIdx]); updateZoomButtons();
});
document.getElementById('zoomOut').addEventListener('click',function(){
  if(tIdx<=0) return;
  tIdx--; applyZoom(T_STEPS[tIdx]); updateZoomButtons();
});
updateZoomButtons();
document.getElementById('btnUndo').addEventListener('click',function(){
  if(!history.length) return;
  var entry=history.pop();
  if(entry.action==='add'){
    // undo add: remove the piece
    var idx=pieces.indexOf(entry.piece);
    if(idx>=0) pieces.splice(idx,1);
    entry.piece.keys.forEach(function(k){delete triMap[k];});
    fadingPieces.push({keys:entry.piece.keys,color:entry.piece.color,removedAt:Date.now()});
    updateStats();requestAnimationFrame(fadeLoop);
  } else {
    // undo remove: fade in, then add to pieces after animation
    fadingPieces.push({keys:entry.piece.keys,color:entry.piece.color,removedAt:Date.now(),fadeIn:true,piece:entry.piece});
    updateStats();requestAnimationFrame(fadeLoop);
  }
});
document.getElementById('btnClear').addEventListener('click',function(){
  document.getElementById('ovConfirm').classList.add('show');
});
document.getElementById('btnConfirmYes').addEventListener('click',function(){
  var now=Date.now();
  var ANIM_MS=2000;

  pieces.forEach(function(piece){
    piece.keys.forEach(function(k){delete triMap[k];});
    var ct=getCenter(+piece.keys[0].split(',')[0], +piece.keys[0].split(',')[1]);
    var angle=Math.random()*Math.PI*2;
    var spd=0.1+Math.random()*0.5;
    fadingPieces.push({
      keys:piece.keys, color:piece.color, removedAt:now,
      clearAnim:true, animMs:ANIM_MS,
      cx:ct.x, cy:ct.y,
      vx:Math.cos(angle)*spd,
      vy:Math.sin(angle)*spd,
      spin:(Math.random()-0.5)*0.1
    });
  });

  pieces=[];history=[];updateStats();
  requestAnimationFrame(clearAnimLoop);
  document.getElementById('ovConfirm').classList.remove('show');
});

var clearAnimLooping=false;
function clearAnimLoop(){
  var now=Date.now();
  fadingPieces=fadingPieces.filter(function(fp){
    return fp.clearAnim ? now-fp.removedAt<fp.animMs : now-fp.removedAt<FADE_MS;
  });
  renderWithAnim();
  if(fadingPieces.length) requestAnimationFrame(clearAnimLoop);
}
document.getElementById('btnConfirmNo').addEventListener('click',function(){
  document.getElementById('ovConfirm').classList.remove('show');
});
document.getElementById('ovConfirm').addEventListener('click',function(e){
  if(e.target===this) this.classList.remove('show');
});
// ── Confetti ───────────────────────────────────────────────────
var confettiCanvas=document.getElementById('confettiCanvas');
var confetti=[];
var confettiGen=0; // increment to invalidate old loops

function launchConfetti(){
  var myGen=++confettiGen;
  confettiCanvas.width=window.innerWidth;
  confettiCanvas.height=window.innerHeight;
  confettiCanvas.style.display='block';
  var cc=confettiCanvas.getContext('2d');
  var colors=WOODS.map(function(w){return w.color;});
  var W=confettiCanvas.width, H2=confettiCanvas.height;
  var pieces2=[];
  for(var i=0;i<120;i++){
    var shape=Math.random()<0.5?'tri':'rh';
    var color=colors[Math.floor(Math.random()*colors.length)];
    var size=14+Math.random()*18;
    pieces2.push({
      x: Math.random()*W,
      y: -size - Math.random()*H2*0.5,
      vx: (Math.random()-0.5)*5,
      vy: 3+Math.random()*5,
      spin: (Math.random()-0.5)*0.12,
      angle: Math.random()*Math.PI*2,
      size: size, shape: shape, color: color,
      delay: Math.random()*400
    });
  }
  var startTime=Date.now();
  (function loop(){
    if(confettiGen!==myGen){ cc.clearRect(0,0,W,H2); return; } // killed
    var elapsed=Date.now()-startTime;
    cc.clearRect(0,0,W,H2);
    var any=false;
    pieces2.forEach(function(p){
      if(elapsed<p.delay){any=true;return;}
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.12; p.angle+=p.spin;
      if(p.y<H2+50) any=true;
      drawConfettiPiece(cc,p);
    });
    if(any) requestAnimationFrame(loop);
    else confettiCanvas.style.display='none';
  })();
}

function drawConfettiPiece(c2d,p){
  if(p.y>confettiCanvas.height+50) return;
  c2d.save();
  c2d.translate(p.x,p.y);
  c2d.rotate(p.angle);
  c2d.fillStyle=p.color;
  c2d.strokeStyle='rgba(0,0,0,0.25)';
  c2d.lineWidth=0.6;
  var s=p.size, h=s*Math.sqrt(3)/2;
  c2d.beginPath();
  if(p.shape==='tri'){
    c2d.moveTo(0,-h*0.67); c2d.lineTo(s/2,h*0.33); c2d.lineTo(-s/2,h*0.33);
  } else {
    c2d.moveTo(-s/2,h/2); c2d.lineTo(s/4,h/2); c2d.lineTo(s/2,-h/2); c2d.lineTo(-s/4,-h/2);
  }
  c2d.closePath();
  c2d.fill(); c2d.stroke();
  c2d.restore();
}

document.getElementById('btnDone').addEventListener('click',function(){
  document.getElementById('ov').classList.add('show');
  var thumb=document.getElementById('thumb');
  thumb.width=CW; thumb.height=CH;
  thumb.style.width='100%'; thumb.style.height='auto';
  thumb.getContext('2d').drawImage(canvas,0,0,CW,CH,0,0,CW,CH);
  launchConfetti();
});
document.getElementById('btnClose').addEventListener('click',function(){
  document.getElementById('ov').classList.remove('show');
  confettiGen++; // stop confetti
  confettiCanvas.style.display='none';
});
document.getElementById('btnDl').addEventListener('click',function(){
  var a=document.createElement('a');a.download='yosegi.png';a.href=canvas.toDataURL();a.click();
});
document.getElementById('ov').addEventListener('click',function(e){if(e.target===this) this.classList.remove('show');});

render();
})();
